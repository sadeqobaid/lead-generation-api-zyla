services:
  migrate:
    build: .
    command: python scripts/migrate.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_api:${POSTGRES_PASSWORD}@postgres:5432/lead_api
      AUTO_CREATE_SCHEMA: "false"
      QUEUE_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      IDEMPOTENCY_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_api:${POSTGRES_PASSWORD}@postgres:5432/lead_api
      AUTO_CREATE_SCHEMA: "false"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      IDEMPOTENCY_BACKEND: redis
      QUEUE_BACKEND: redis
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python scripts/worker.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lead_api:${POSTGRES_PASSWORD}@postgres:5432/lead_api
      AUTO_CREATE_SCHEMA: "false"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      IDEMPOTENCY_BACKEND: redis
      QUEUE_BACKEND: redis
      QUEUE_CONSUMER: compose-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lead_api
      POSTGRES_USER: lead_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the shell or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_api -d lead_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
