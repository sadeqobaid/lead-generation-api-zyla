[project]
name = "lead-generation-api"
version = "0.1.0"
description = "Runnable MVP for a multi-tenant B2B lead generation API"
requires-python = ">=3.11"
authors = [{name = "Sadeq Obaid"}]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
